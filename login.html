<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Login and Register | Vintage Rides</title>
 <link rel="stylesheet" href="style.css">
 <script src="app.js" defer></script>
 
</head>
<body data-page="login">
 <header class="site-header">
  <a class="brand" href="index.html">Vintage Rides</a>
  <button class="menu-button" id="menu-button" type="button">Menu</button>
  <nav id="main-nav">
   <a href="index.html">Home</a>
   <a href="cars.html">Collection</a>
   <a href="compare.html">Compare</a>
   <a href="about.html">About</a>
   <a href="contact.html">Contact</a>
   <a href="login.html">Login / Register</a>
   <a href="cart.html">Cart</a>
  </nav>
 </header>
 <main class="container">

  <h1>Account</h1>
  <div class="two-column">
   <section class="simple-panel">
    <h2>Login</h2>
    <form id="login-form" class="form-grid">
     <label>Email<input name="email" type="email" required></label>
     <label>Password<input name="password" type="password" required minlength="8" pattern="(?=.*[0-9]).{8,}" title="Password must be at least 8 characters and include a number."></label>
     <label> role<select name="role" required><option value="">Select role</option><option value="buyer">Buyer</option><option value="seller">Seller</option><option value="inspector">Inspector</option><option value="admin">Admin</option></select></label>
     <button class="button" type="submit">Login</button>
    </form>
    <p id="login-message" class="message" role="status"></p>
   </section>
   <section class="simple-panel">
    <h2>Create account</h2>
    <form id="register-form" class="form-grid">
     <label>Full name<input name="name" required minlength="3"></label>
     <label>Email<input name="email" type="email" required></label>
     <label>Phone<input name="phone" type="tel" required pattern="[0-9+() -]{11,20}"></label>
     <label>Password<input name="password" type="password" required minlength="8" pattern="(?=.*[0-9]).{8,}" title="Password must be at least 8 characters and include a number."></label>
     <label>Confirm password<input name="confirm" type="password" required minlength="8" pattern="(?=.*[0-9]).{8,}" title="Password must be at least 8 characters and include a number."></label>
     <label>Account type<select name="role" required><option value="">Select role</option><option value="buyer">Buyer</option><option value="seller">Seller</option></select></label>
     <button class="button" type="submit">Register</button>
    </form>
    <p id="register-message" class="message" role="status"></p>
   </section>
  </div>
  

 </main>
 <footer class="site-footer">Vintage Rides</footer>
</body>
</html>
