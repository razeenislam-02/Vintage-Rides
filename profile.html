<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>My Profile | Vintage Rides</title>
 <link rel="stylesheet" href="style.css">
 <script src="app.js" defer></script>
 
</head>
<body data-page="profile">
 <header class="site-header">
  <a class="brand" href="index.html">Vintage Rides</a>
  <button class="menu-button" id="menu-button" type="button">Menu</button>
  <nav id="main-nav">
   <a href="index.html">Home</a>
   <a href="cars.html">Collection</a>
   <a href="compare.html">Compare</a>
   <a href="about.html">About</a>
   <a href="contact.html">Contact</a>
   <a href="login.html">Login / Register</a>
   <a href="cart.html">Cart</a>
  </nav>
 </header>
 <main class="container">

  <h1>My Profile</h1>
  <form id="profile-form" class="form-grid">
   <label>Full name<input name="name" required minlength="3" value=" User"></label>
   <label>Email<input name="email" type="email" required value="user@example.com"></label>
   <label>Phone<input name="phone" type="tel" pattern="[0-9+() -]{11,20}" required></label>
   <button class="button" type="submit">Update Profile</button>
   <button class="button secondary" id="delete-profile" type="button">Delete Profile</button>
  </form>
  <p id="profile-message" class="message" role="status"></p>

 </main>
 <footer class="site-footer">Vintage Rides</footer>
</body>
</html>
