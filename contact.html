<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Contact | Vintage Rides</title>
 <link rel="stylesheet" href="style.css">
 <script src="app.js" defer></script>
 
</head>
<body data-page="contact">
 <header class="site-header">
  <a class="brand" href="index.html">Vintage Rides</a>
  <button class="menu-button" id="menu-button" type="button">Menu</button>
  <nav id="main-nav">
   <a href="index.html">Home</a>
   <a href="cars.html">Collection</a>
   <a href="compare.html">Compare</a>
   <a href="about.html">About</a>
   <a href="contact.html">Contact</a>
   <a href="login.html">Login / Register</a>
   <a href="cart.html">Cart</a>
  </nav>
 </header>
 <main class="container">

  <h1>Contact Us</h1>
  <p>Send a question about a vehicle, account or consignment.</p>
  <section class="simple-panel">
   <form id="contact-form" class="form-grid">
    <label>Full name<input name="name" required minlength="3"></label>
    <label>Email<input name="email" type="email" required></label>
    <label>Inquiry type<select name="type" required><option value="">Choose one</option><option>Vehicle inquiry</option><option>Buying support</option><option>Selling / consignment</option><option>Other</option></select></label>
    <label>Message<textarea name="message" required minlength="15"></textarea></label>
    <button class="button" type="submit">Send Message</button>
   </form>
   <p id="contact-message" class="message" role="status"></p>
  </section>

 </main>
 <footer class="site-footer">Vintage Rides</footer>
</body>
</html>
